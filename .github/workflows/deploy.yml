name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env.production com Segredos
        run: |
          echo "VITE_SHEETS_API_KEY=${{ secrets.SHEETS_API_KEY }}" >> .env.production
          echo "VITE_SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env.production
          echo "VITE_SHEETS_RANGE=Página1" >> .env.production
          echo "VITE_APPS_SCRIPT_URL=${{ secrets.APPS_SCRIPT_URL }}" >> .env.production

      - name: Build do Vue
        run: npm run build

      - name: Deploy para GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          force: true